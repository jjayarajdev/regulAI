# Fly.io app config — Dagster orchestrator
#
# Deploy as a SEPARATE Fly app from regulai (api). Both apps in the
# same Fly org reach each other via the internal *.internal DNS:
#
#   - api → dagster: http://regulai-dagster.internal:3000
#   - dagster → api: http://regulai.internal:8765
#
# Quick start:
#
#   fly apps create regulai-dagster
#   fly volumes create dagster_home --region bom --size 1 --app regulai-dagster
#   fly secrets set --app regulai-dagster \
#     OPENAI_API_KEY=sk-... \
#     SNOWFLAKE_ACCOUNT=... \
#     SNOWFLAKE_USER=... \
#     SNOWFLAKE_TOKEN=... \
#     SNOWFLAKE_AUTHENTICATOR=PROGRAMMATIC_ACCESS_TOKEN \
#     SNOWFLAKE_ROLE=... \
#     SNOWFLAKE_WAREHOUSE=COMPUTE_WH \
#     SNOWFLAKE_DATABASE=INSURANCE_REGULATORY \
#     NEO4J_URI=neo4j+s://<aura>.databases.neo4j.io \
#     NEO4J_USER=neo4j \
#     NEO4J_PASSWORD=...
#   fly deploy --config fly.dagster.toml --app regulai-dagster
#
# Then update the api app to point at it:
#
#   fly secrets set --app regulai \
#     DAGSTER_URL=http://regulai-dagster.internal:3000

app = "regulai-dagster"
primary_region = "bom"

[build]
  # Same Dockerfile as the api app — different command via overrides below.

[env]
  DAGSTER_HOME = "/app/.dagster_home"
  # Dagster's webserver uses --path-prefix when behind a reverse proxy.
  # On Fly we expose it directly so no prefix is needed; URLs work at root.

[experimental]
  # Override the Dockerfile CMD with the dagster webserver process.
  cmd = ["uv", "run", "dagster", "dev", "-m", "dagster_project", "--host", "0.0.0.0", "--port", "3000"]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"  # dagster boot is slower than uvicorn
    method = "GET"
    path = "/server_info"

[[mounts]]
  # Persist Dagster's sqlite-backed run history / schedules across deploys.
  source = "dagster_home"
  destination = "/app/.dagster_home"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
