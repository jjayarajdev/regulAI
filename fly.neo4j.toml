# Fly.io app config — Neo4j 5 community
#
# Optional. The simpler path is to use Neo4j Aura's free tier (cloud-
# hosted, no Fly app needed). Use this only if you want Neo4j inside
# Fly for some reason — e.g. data sovereignty, latency, or avoiding
# a second cloud-vendor dependency.
#
# Quick start:
#
#   fly apps create regulai-neo4j
#   fly volumes create neo4j_data --region bom --size 3 --app regulai-neo4j
#   fly secrets set --app regulai-neo4j NEO4J_AUTH=neo4j/<strong-password>
#   fly deploy --config fly.neo4j.toml --app regulai-neo4j
#
# Then point the api + dagster apps at it:
#
#   fly secrets set --app regulai \
#     NEO4J_URI=bolt://regulai-neo4j.internal:7687 \
#     NEO4J_USER=neo4j \
#     NEO4J_PASSWORD=<the password>
#   fly secrets set --app regulai-dagster \
#     NEO4J_URI=bolt://regulai-neo4j.internal:7687 \
#     NEO4J_USER=neo4j \
#     NEO4J_PASSWORD=<the password>

app = "regulai-neo4j"
primary_region = "bom"

[build]
  image = "neo4j:5-community"

[env]
  NEO4J_PLUGINS = '["apoc"]'
  NEO4J_server_memory_pagecache_size = "512M"
  NEO4J_server_memory_heap_max__size = "1G"
  # Tell Neo4j to advertise the public Fly hostname when clients connect
  # to its Bolt port — Browser instances at https://browser.neo4j.io and
  # cypher-shell both honor this. Without it Neo4j hands out its internal
  # IP and clients fail to follow.
  NEO4J_server_bolt_advertised__address = "regulai-neo4j.fly.dev:7687"

# Public access (Bolt only — strong password is the only defense):
#   - 7687 (Bolt): exposed via [[services]] below with Fly's TLS handler.
#     Friends point Neo4j's free hosted Browser
#     (https://browser.neo4j.io) at neo4j+s://regulai-neo4j.fly.dev:7687
#     with the same password. No app install needed — browser-only.
#
# We don't expose 7474 (the embedded Browser UI) publicly because:
#   - Neo4j 5 / OpenJDK binds IPv6-only on Fly's kernel when given 0.0.0.0,
#     making Fly's IPv4 edge healthcheck refuse to mark it healthy.
#   - The fix (-Djava.net.preferIPv4Stack=true) breaks 6PN IPv6 reachability,
#     which the api + dagster apps depend on for their internal Neo4j
#     connection. Bolt over a [[services]] TCP+TLS block doesn't have the
#     IPv4 healthcheck issue, so we go Bolt-only here.
#
# Cross-app (api + dagster reaching Neo4j over 6PN) still works via
# regulai-neo4j.internal:7687 — IPv6, no public roundtrip.

[[services]]
  # Bolt protocol on 7687 — friends connect from browser.neo4j.io,
  # cypher-shell, Neo4j Desktop, drivers, etc.
  internal_port = 7687
  protocol = "tcp"
  [[services.ports]]
    port = 7687
    handlers = ["tls"]
  [[services.tcp_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"

[[mounts]]
  source = "neo4j_data"
  destination = "/data"
  initial_size = "3gb"

[[vm]]
  # Neo4j needs more RAM than the api/dagster vms — its query planner
  # benefits from heap headroom and the pagecache config above presumes
  # 1.5-2GB total available.
  size = "shared-cpu-2x"
  memory = "2gb"
  cpus = 2
