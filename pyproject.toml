[project]
name = "regulai"
version = "0.1.0"
description = "RegulAI — KG-driven regulatory compliance for insurance stat reporting (LHS phase)"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.50",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
