[project]
name = "regulai"
version = "0.1.0"
description = "RegulAI — KG-driven regulatory compliance for insurance stat reporting (LHS phase)"
requires-python = ">=3.11"
dependencies = [
    "neo4j>=5.20",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "openai>=1.50",
    "pypdf>=4.0",
    "pymupdf>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pyarrow>=24.0.0",
    "snowflake-connector-python>=4.4.0",
    "strawberry-graphql[fastapi]>=0.220",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    # In-process SQL engine for CI verification of violation_sql.
    # See tests/_fl_duckdb_harness.py — executes the same SQL the
    # production /validate endpoint runs, no Snowflake creds needed.
    # Catches alias bugs, SQL syntax errors, rule logic regressions.
    "duckdb>=1.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
python_files = ["test_*.py"]
