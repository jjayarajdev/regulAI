name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      neo4j:
        image: neo4j:5-community
        env:
          NEO4J_AUTH: neo4j/regulai-dev-password
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "wget -qO- http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: regulai-dev-password
      # No real key needed: Sentinel tests use a FakeLLM stub and rebuild-kg
      # replays the committed extraction cache without calling OpenAI.
      OPENAI_API_KEY: ci-dummy-key
      # Snowflake creds intentionally absent — those tests skip themselves.

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Apply KG migrations
        run: uv run python -m scripts.migrate

      - name: Seed KG from committed extraction cache
        run: uv run python -m scripts.rebuild_kg

      - name: Run tests
        run: uv run pytest tests/ -v
