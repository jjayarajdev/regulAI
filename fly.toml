# Fly.io app config — RegulAI FastAPI (api)
#
# Deploys ONLY the FastAPI app. Neo4j + Dagster have their own fly.toml
# files (fly.neo4j.toml, fly.dagster.toml) — deploy them as separate
# Fly apps and they reach each other over Fly's internal 6PN network.
#
# Quick start (after `fly auth login`):
#
#   # 1. Create the apps (once)
#   fly apps create regulai
#
#   # 2. Set secrets (creds + cross-app URLs)
#   fly secrets set \
#     OPENAI_API_KEY=sk-... \
#     SNOWFLAKE_ACCOUNT=... \
#     SNOWFLAKE_USER=... \
#     SNOWFLAKE_TOKEN=... \
#     SNOWFLAKE_AUTHENTICATOR=PROGRAMMATIC_ACCESS_TOKEN \
#     SNOWFLAKE_ROLE=... \
#     SNOWFLAKE_WAREHOUSE=COMPUTE_WH \
#     SNOWFLAKE_DATABASE=INSURANCE_REGULATORY \
#     NEO4J_URI=neo4j+s://<aura-instance>.databases.neo4j.io \
#     NEO4J_USER=neo4j \
#     NEO4J_PASSWORD=... \
#     DAGSTER_URL=http://regulai-dagster.internal:3000
#
#   # 3. Deploy
#   fly deploy
#
#   # 4. Seed the KG inside the running machine
#   fly ssh console -C "make rebuild-kg migrate-validation-rules seed-jurisdictions tag-federal-defaults seed-filing-obligations seed-florida migrate-fl-validation-rules seed-demo-violations"
#
#   # 5. Open
#   fly open    # https://regulai.fly.dev/workstation
#
# Minimum credible demo (no Dagster, no own Neo4j):
#   - Use Neo4j Aura free tier for NEO4J_URI/USER/PASSWORD
#   - Leave DAGSTER_URL pointing at the missing dagster app — the
#     /admin/schedule page handles "Dagster offline" gracefully
#   - /admin/upload won't complete the medallion run (it needs Dagster
#     to fire the upload_to_gold_job) but upload+validate+convert work

app = "regulai"
primary_region = "iad"  # US-East — co-located with the Databricks warehouse
                        # (fast data path); bom had no capacity. "sin"/"bom"
                        # are closer to an India-based audience if you prefer.

[build]
  # Fly auto-detects ./Dockerfile in repo root. No extra config needed.

[env]
  # Internal port the FastAPI app listens on; matches uvicorn --port in
  # the Dockerfile CMD. Fly routes 80/443 → this port via the
  # [http_service] block below.
  PORT = "8765"
  # DuckDB is the primary warehouse (the REGULAI_DB secret also says duckdb;
  # keep them in agreement). State — the DuckDB file, uploads, sealed
  # submissions — lives on the mounted volume; the entrypoint seeds it from
  # the image's baked materialized/ on first boot and symlinks it in.
  REGULAI_STATE_DIR = "/data/materialized"
  # docker_entry.sh does the volume seeding above, then execs the service.
  # skip = no Neo4j wait / KG or warehouse bootstrap at boot (the warehouse
  # file ships in the image; a stopped Neo4j must not block the API).
  REGULAI_BOOTSTRAP = "skip"

# DuckDB is single-writer: exactly one machine. The volume mount enforces
# it (a machine can only run where its volume lives) — do not scale out.
[mounts]
  source = "regulai_data"
  destination = "/data"

[experimental]
  # Bind IPv4 — matches dagster app for consistency. Cross-app traffic
  # (e.g. dagster → api back-channel, if/when added) should use the
  # .flycast DNS form which routes through Fly's IPv4-friendly proxy.
  # Runs through the same entrypoint as compose: it seeds REGULAI_STATE_DIR
  # from the image on first boot and symlinks materialized/ into the volume
  # (tini stays PID 1 via the Dockerfile ENTRYPOINT).
  cmd = ["/app/scripts/docker_entry.sh", "uv", "run", "uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8765"]

[http_service]
  internal_port = 8765
  force_https = true
  # Parked between demos — no auto-start, no minimum running machine. Wake it
  # with `fly machine start` (plus regulai-neo4j / regulai-dagster). For a demo
  # window flip to auto_start_machines = true, min_machines_running = 1 so
  # the app stays warm and there is no Fly cold-start.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 0
  processes = ["app"]

  # Healthcheck hits the static React index — confirms the process is serving
  # without depending on Neo4j or a warm Databricks warehouse, so an external
  # dependency being asleep can't flap the check or trigger a rollback.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/app/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  cpus = 1
